name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_application:
    runs-on: ubuntu-latest
    container:
      image: gradle:9.2.1-jdk17
      options: --user 0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: gradle build -x test

      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-libs
          path: app/build/libs/app-all.jar
          if-no-files-found: error

  smoke_test:
    runs-on: ubuntu-latest
    needs: build_application

    steps:
      - name: Set up JDK 17 
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: app-libs
          path: app/build/libs

      - name: Run basic functionality test
        run: |
          timeout 20s java -jar app/build/libs/app-all.jar "https://google.com" 0 > crawler_output.txt
          if [ ! -s crawler_output.txt ]; then echo "Test selhal - žádný výstup"; exit 1; fi
          echo "Crawler úspěšně odeslal request a vrátil data v časovém limitu."

      - name: Save test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: crawler_output.txt